<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E0F0E" />
      <stop offset="50%" stop-color="#090A09" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <!-- Emerald Mesh Ambient Glows -->
    <radialGradient id="glowTopLeft" cx="150" cy="120" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F7A5A" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#1F7A5A" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#1F7A5A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRightStage" cx="920" cy="315" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#2383E2" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A18" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#121210" stop-opacity="0.95" />
    </linearGradient>

    <!-- Logo Coin Gradient -->
    <linearGradient id="coinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>

    <!-- Decorative Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .font-serif { font-family: 'Newsreader', 'Instrument Serif', 'Liberation Serif', 'DejaVu Serif', Georgia, serif; }
    .font-sans { font-family: 'Plus Jakarta Sans', 'Liberation Sans', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', 'SF Mono', Menlo, monospace; }
  </style>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glowTopLeft)" />
  <rect width="1200" height="630" fill="url(#glowRightStage)" />

  <!-- 1px Hairline Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <!-- Monospace Coordinates & Header -->
  <g transform="translate(64, 72)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(31,122,90,0.18)" stroke="rgba(52,211,153,0.3)" stroke-width="1" />
    <circle cx="16" cy="16" r="4.5" fill="#10B981" />
    <text x="30" y="21" class="font-mono" font-size="11.5" font-weight="700" fill="#34D399" letter-spacing="1.2">01 // SISTEMA PATRIMONIAL</text>
  </g>

  <!-- System Version Right Anchor -->
  <text x="1136" y="93" text-anchor="end" class="font-mono" font-size="11.5" font-weight="600" fill="rgba(255,255,255,0.35)" letter-spacing="1">LOCAL-FIRST · EDICIÓN 2026</text>

  <!-- LEFT HERO SECTION (Narrative & Branding) -->
  <g transform="translate(64, 150)">
    <!-- Big Title: FinancePal -->
    <text x="0" y="70" class="font-serif" font-size="82" font-weight="400" fill="#FFFFFF" letter-spacing="-1.5">FinancePal</text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="130" class="font-sans" font-size="23" font-weight="500" fill="#EDEDED" letter-spacing="-0.3">
      Gestión patrimonial serena, privada y en alta fidelidad.
    </text>
    <text x="0" y="165" class="font-sans" font-size="16.5" font-weight="400" fill="#A1A1AA" letter-spacing="0">
      Controla gastos, ingresos, presupuestos y metas bajo soberanía de datos.
    </text>

    <!-- Core Feature Pills Grid -->
    <g transform="translate(0, 220)">
      <!-- Pill 1: Local-First -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#1F7A5A" />
        <text x="36" y="26" class="font-mono" font-size="11.5" font-weight="600" fill="#E4E4E7">Soberanía Local</text>
      </g>

      <!-- Pill 2: Encriptación -->
      <g transform="translate(196, 0)">
        <rect width="190" height="42" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#2383E2" />
        <text x="36" y="26" class="font-mono" font-size="11.5" font-weight="600" fill="#E4E4E7">WebCrypto Encriptado</text>
      </g>

      <!-- Pill 3: Nube Opcional -->
      <g transform="translate(402, 0)">
        <rect width="170" height="42" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#D9730D" />
        <text x="36" y="26" class="font-mono" font-size="11.5" font-weight="600" fill="#E4E4E7">Supabase Sync</text>
      </g>
    </g>

    <!-- Bottom URL Link Pill -->
    <g transform="translate(0, 310)">
      <text x="0" y="24" class="font-mono" font-size="14" font-weight="600" fill="#34D399" letter-spacing="0.5">https://finance-pal.app</text>
      <text x="210" y="24" class="font-mono" font-size="13" font-weight="400" fill="rgba(255,255,255,0.35)">· Privado · Sin Rastreadores · Código Abierto</text>
    </g>
  </g>

  <!-- RIGHT HERO SECTION (Visual Stage: Floating Logo & Telemetry Cards) -->
  <g transform="translate(730, 130)">
    <!-- Decorative Stage Glow Behind Cards -->
    <ellipse cx="200" cy="190" rx="180" ry="150" fill="#10B981" opacity="0.12" />

    <!-- Card 1: Main Logo Squircle Hero -->
    <g transform="translate(80, 0)">
      <rect width="240" height="240" rx="60" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
      <rect width="240" height="240" rx="60" fill="none" stroke="url(#coinGrad)" stroke-width="1.5" opacity="0.4" />

      <!-- Centered V2 Logo Vector -->
      <g transform="translate(24, 24) scale(4)">
        <!-- Monograma continuo FP -->
        <path
          d="M 15 38 V 10 H 26 C 32 10 35 13 35 17 C 35 21 32 24 26 24 H 15"
          stroke="url(#stemGrad)"
          stroke-width="3.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <!-- Barra transversal F -->
        <path
          d="M 15 30 H 26"
          stroke="#10B981"
          stroke-width="3.4"
          stroke-linecap="round"
        />
        <!-- Moneda Próspera -->
        <circle cx="25.5" cy="17" r="3.8" fill="url(#coinGrad)" />
        <circle cx="24.4" cy="15.8" r="1.1" fill="#FFFFFF" opacity="0.9" />
      </g>
    </g>

    <!-- Card 2: Floating Telemetry Card 1 (Tasa de Ahorro) -->
    <g transform="translate(0, 205)">
      <rect width="210" height="110" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />
      <g transform="translate(20, 22)">
        <text class="font-mono" font-size="10.5" font-weight="700" fill="#A1A1AA" letter-spacing="0.8">TASA DE AHORRO</text>
        <text y="36" class="font-mono" font-size="28" font-weight="700" fill="#34D399" letter-spacing="-0.5">+42.8%</text>
        <text y="62" class="font-sans" font-size="11" font-weight="500" fill="#71717A">Meta mensual alcanzada</text>
      </g>
    </g>

    <!-- Card 3: Floating Telemetry Card 2 (Patrimonio Neto) -->
    <g transform="translate(190, 260)">
      <rect width="210" height="110" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" />
      <g transform="translate(20, 22)">
        <text class="font-mono" font-size="10.5" font-weight="700" fill="#A1A1AA" letter-spacing="0.8">FLUJO INTEGRAL</text>
        <text y="36" class="font-mono" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">$148,250</text>
        <text y="62" class="font-sans" font-size="11" font-weight="500" fill="#34D399">↑ 18.4% vs mes anterior</text>
      </g>
    </g>
  </g>
</svg>
