<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181816" />
      <stop offset="100%" stop-color="#0A0A09" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="240" y1="150" x2="310" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="160" y1="100" x2="160" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDEDED" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" stroke="#2C2C28" stroke-width="8" />

  <!-- Ambient Coin Glow -->
  <circle cx="272" cy="181" r="60" fill="#10B981" opacity="0.25" />

  <!-- Monograma continuo FP: Asta F/P + Bucle superior P -->
  <path
    d="M 160 405 V 106 H 277 C 341 106 373 138 373 181 C 373 224 341 256 277 256 H 160"
    stroke="url(#stemGrad)"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Barra transversal de F -->
  <path
    d="M 160 320 H 280"
    stroke="#10B981"
    stroke-width="36"
    stroke-linecap="round"
  />

  <!-- Semilla / Moneda Próspera -->
  <circle
    cx="272"
    cy="181"
    r="40"
    fill="url(#coinGrad)"
  />

  <!-- Destello especular en moneda -->
  <circle
    cx="259"
    cy="168"
    r="13"
    fill="#FFFFFF"
    opacity="0.9"
  />
</svg>
