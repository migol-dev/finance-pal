    <link rel="shortcut icon" href="/favicon.ico" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / WhatsApp / Facebook / LinkedIn / Discord -->
    <meta property="og:site_name" content="FinancePal" />
    <meta property="og:title" content="FinancePal" />

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://finance-pal.app/og-image.png" />

    <!-- Security Headers managed by Vercel (vercel.json) -->
    <!-- CSP, HSTS, X-Frame-Options, etc. delivered via HTTP headers -->

    <!-- Zero-Flash Theme & UI Initializer (Segundo 1) -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('fp-theme-pref');
          var theme = 'system';
          var uiVersion = 'v2';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.theme) theme = parsed.theme;
            if (parsed.uiVersion) uiVersion = parsed.uiVersion;
          }
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          if (uiVersion === 'classic') {
            root.classList.add('ui-classic');
            root.classList.remove('ui-v2');
          } else {
            root.classList.add('ui-v2');
            root.classList.remove('ui-classic');
          }
          root.style.backgroundColor = isDark ? '#0C0C0B' : '#FAF8F5';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0C0C0B' : '#FAF8F5');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
