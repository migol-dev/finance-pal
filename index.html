<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#F43F5E" />
    <title>Finance Pal — Tus finanzas, hermosas</title>
    <meta name="description" content="Gestiona ingresos, gastos, ahorros y metas con un diseño vibrante. App instalable en Android." />
    <meta name="author" content="Finance Pal" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" crossorigin="anonymous" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="Finance Pal" />
    <meta property="og:description" content="Tus finanzas personales, hermosas e intuitivas." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Security Headers managed by Vercel (vercel.json) -->
    <!-- CSP, HSTS, X-Frame-Options, etc. delivered via HTTP headers -->

    <!-- Zero-Flash Theme & UI Initializer (Segundo 1) -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('fp-theme-pref');
          var theme = 'system';
          var uiVersion = 'v2';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.theme) theme = parsed.theme;
            if (parsed.uiVersion) uiVersion = parsed.uiVersion;
          }
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          if (uiVersion === 'classic') {
            root.classList.add('ui-classic');
            root.classList.remove('ui-v2');
          } else {
            root.classList.add('ui-v2');
            root.classList.remove('ui-classic');
          }
          root.style.backgroundColor = isDark ? '#0C0C0B' : '#FAF8F5';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0C0C0B' : '#FAF8F5');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
